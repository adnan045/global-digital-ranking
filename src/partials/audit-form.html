<form class="lead-form" id="lead-form" data-endpoint="/api/leads" novalidate>
  <div class="field honeypot" aria-hidden="true"><label for="contact_website">Leave this field empty</label><input id="contact_website" name="contact_website" type="text" tabindex="-1" autocomplete="off"></div>
  <input type="hidden" name="source" value="website-audit">
  <div class="field"><label for="name">Your name</label><input id="name" name="name" type="text" placeholder="Alex Morgan" required></div>
  <div class="field"><label for="email">Work email</label><input id="email" name="email" type="email" placeholder="alex@company.com" required></div>
  <div class="field"><label for="company">Company</label><input id="company" name="company" type="text" placeholder="Company name" required></div>
  <div class="field"><label for="website">Website URL</label><input id="website" name="website" type="url" placeholder="https://" required></div>
  <div class="field full"><label for="service">What would you like to improve?</label><select id="service" name="service" required><option value="" selected disabled>Choose an area</option><option>Website & conversion</option><option>SEO & visibility</option><option>Google Ads & paid growth</option><option>Not sure yet — I need a view</option></select></div>
  <div class="field full"><label for="message">Anything we should know?</label><textarea id="message" name="message" placeholder="Tell us about your goal, market or timeline."></textarea></div>
  <label class="consent-row full"><input name="consent" type="checkbox" value="yes" required><span>I agree to be contacted about this enquiry and understand I can opt out at any time.</span></label>
  <div class="form-foot"><small>We’ll use these details to respond to your request. See our <a href="privacy.html">privacy notice</a>.</small><button class="button button-primary" type="submit">Request my audit <span class="arrow">↗</span></button></div>
  <div class="form-success" id="form-success" role="status">Thanks — your request is on its way. We’ll be in touch with a practical next step.</div>
</form>
